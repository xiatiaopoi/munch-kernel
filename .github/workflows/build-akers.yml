name: Build akers aptusitu kernel

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      device:
        description: '设备代号'
        required: true
        type: string
        default: 'munch'
      ksu:
        description: '带 KernelSU'
        required: true
        type: choice
        default: 'ksu'
        options:
          - 'ksu'
          - 'noksu'

env:
  SRC: ${{ github.workspace }}/kernel

jobs:
  build:
    name: Build ${{ github.event.inputs.device }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio \
            libssl-dev ccache python-is-python3 unzip libelf-dev

      - name: 准备 Clang 13.0.1 工具链
        run: |
          mkdir -p $HOME/proton-clang/proton-clang-20210522
          cd $HOME/proton-clang/proton-clang-20210522
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/13.0.1-20230207-release/Clang-13.0.1-20230207.tar.gz
          tar -zxf Clang-13.0.1-20230207.tar.gz
          ls | head
          ls bin | grep -E "^(clang|aarch64-linux-gnu-ld|arm-linux-gnueabi-ld)$" || true

      - name: 克隆内核源码
        run: |
          git clone --depth=1 -b android16-aptusitu-zyc \
            https://github.com/akers4238/kernel_xiaomi_sm8250_mod-20251002-zyc "$SRC"
          cd "$SRC"
          git log -1 --oneline
          make kernelversion
          ls -l arch/arm64/configs/${{ github.event.inputs.device }}_defconfig
          echo "susfs:"; ls -l fs/susfs.c include/linux/susfs.h
          echo "ksu hooks:"; grep -c ksu_handle fs/stat.c fs/exec.c

      - name: 编译
        run: |
          cd "$SRC"
          bash build.sh ${{ github.event.inputs.device }} ${{ github.event.inputs.ksu }}
          ls -l *.zip
          ls -l out/arch/arm64/boot/ | head

      - name: 保留失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed
          path: |
            kernel/*.log
            kernel/out/.config
          retention-days: 7

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: akers-${{ github.event.inputs.device }}-${{ github.event.inputs.ksu }}
          path: ${{ github.workspace }}/kernel/*.zip
          retention-days: 30
