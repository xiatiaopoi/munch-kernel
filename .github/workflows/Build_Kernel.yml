name: Build munch kernel RealKing MIUI

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: 'KernelSU 变体'
        required: true
        type: choice
        default: 'SukiSU-Ultra'
        options:
          - 'SukiSU-Ultra'
          - 'ReSukiSU'
          - 'None'
      kernel_suffix:
        description: '内核版本后缀，留空用默认'
        required: false
        type: string
        default: ''
      susfs_enable:
        description: 'SUSFS 隐藏'
        required: true
        type: choice
        default: 'disable'
        options:
          - 'disable'
          - 'enable'

env:
  KSRC: ${{ github.workspace }}/kernel
  KB: m-staging

jobs:
  build:
    name: Build munch
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: 安装依赖与工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex git \
            libelf-dev libssl-dev lz4 python3 python3-pip xz-utils zip unzip wget curl \
            clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          TC="$GITHUB_WORKSPACE/tc"
          mkdir -p "$TC/bin"
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-strip llvm-objcopy llvm-objdump llvm-ranlib; do
            if command -v "$t-14" >/dev/null 2>&1; then
              ln -sf "$(command -v $t-14)" "$TC/bin/$t"
            fi
          done
          "$TC/bin/clang" --version
          "$TC/bin/ld.lld" --version

      - name: 克隆内核源码
        run: |
          git clone --depth=1 -b $KB https://github.com/Rohail33/Realking_kernel_sm8250 "$KSRC"
          cd "$KSRC"
          sed -i '/gcc-wrapper.py/d' Makefile
          grep -n "^CC" Makefile
          git log -1 --oneline
          make kernelversion

      - name: 集成 KernelSU
        if: ${{ github.event.inputs.kernelsu_variant != 'None' }}
        run: |
          cd "$KSRC"
          KSU_VAR="${{ github.event.inputs.kernelsu_variant }}"
          if [ "$KSU_VAR" = "ReSukiSU" ]; then
            KSU_URL="https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/v4.2.0-rc1/kernel/setup.sh"
            KSU_REF="v4.2.0-rc1"
          else
            KSU_URL="https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/main/kernel/setup.sh"
            KSU_REF="main"
          fi
          echo "使用 $KSU_VAR  $KSU_REF"
          curl -LSs "$KSU_URL" | bash -s "$KSU_REF"
          grep -rl "MODULE_IMPORT_NS" drivers/kernelsu | while read f; do
            sed -i 's|^MODULE_IMPORT_NS(.*|/* MODULE_IMPORT_NS 4.19 没有，已移除 */|' "$f"
          done
          if [ ! -f include/linux/pgtable.h ]; then
            printf '#ifndef _LINUX_PGTABLE_SHIM_H\n#define _LINUX_PGTABLE_SHIM_H\n#include <asm/pgtable.h>\n#endif\n' > include/linux/pgtable.h
          fi
          printf '#ifndef _LINUX_KSU_COMPAT_H\n#define _LINUX_KSU_COMPAT_H\n#include <linux/uaccess.h>\nstatic inline long strncpy_from_user_nofault(char *dst, const void __user *unsafe_addr, long count)\n{\n\tlong ret;\n\tpagefault_disable();\n\tret = strncpy_from_user(dst, unsafe_addr, count);\n\tpagefault_enable();\n\treturn ret;\n}\n#endif\n' > include/linux/ksu_compat.h
          grep -rl "strncpy_from_user_nofault" drivers/kernelsu | while read f; do
            grep -q "ksu_compat.h" "$f" || sed -i '1i #include <linux/ksu_compat.h>' "$f"
          done
          grep -rn "ksu_compat" drivers/kernelsu | head -3 || true

      - name: 打 SUSFS 补丁
        if: ${{ github.event.inputs.susfs_enable == 'enable' && github.event.inputs.kernelsu_variant != 'None' }}
        run: |
          cd "$KSRC"
          git clone --depth=1 -b kernel-4.19 https://github.com/ShirkNeko/susfs4ksu /tmp/susfs
          patch -p1 --forward < /tmp/susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch
          cd "$KSRC/KernelSU"
          patch -p1 --forward < /tmp/susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

      - name: 生成配置
        run: |
          cd "$KSRC"
          export PATH="$GITHUB_WORKSPACE/tc/bin:$PATH"
          make ARCH=arm64 O=out LLVM=1 CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- munch_defconfig
          if [ "${{ github.event.inputs.kernelsu_variant }}" != "None" ]; then
            scripts/config --file out/.config -e KSU -e KSU_MANUAL_HOOK
          fi
          if [ "${{ github.event.inputs.susfs_enable }}" = "enable" ]; then
            scripts/config --file out/.config \
              -e KSU_SUSFS \
              -e KSU_SUSFS_SUS_PATH \
              -e KSU_SUSFS_SUS_MOUNT \
              -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_SPOOF_UNAME \
              -e KSU_SUSFS_ENABLE_LOG \
              -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              -e KSU_SUSFS_OPEN_REDIRECT \
              -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
              -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
              -e KSU_SUSFS_TRY_UMOUNT \
              -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
              -d KSU_SUSFS_SUS_OVERLAYFS \
              -d KSU_SUSFS_SUS_SU
          fi
          if [ -n "${{ github.event.inputs.kernel_suffix }}" ]; then
            scripts/config --file out/.config --set-str LOCALVERSION "${{ github.event.inputs.kernel_suffix }}"
          fi
          make ARCH=arm64 O=out LLVM=1 CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -E "^CONFIG_KSU|^CONFIG_LOCALVERSION|^CONFIG_MODVERSIONS|^CONFIG_BUILD_ARM64" out/.config

      - name: 编译内核
        run: |
          cd "$KSRC"
          export PATH="$GITHUB_WORKSPACE/tc/bin:$PATH"
          make ARCH=arm64 O=out LLVM=1 CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) 2>&1 | tee build.log
          ls -l out/arch/arm64/boot/

      - name: 打包 AnyKernel3
        run: |
          cd "$KSRC/out/arch/arm64/boot"
          AK="$KSRC/anykernel"
          KRNL="Image"
          for f in Image.gz-dtb Image.gz Image; do
            if [ -f "$f" ]; then KRNL="$f"; break; fi
          done
          echo "kernel=$KRNL"
          cp "$KRNL" "$AK/"
          if [ -f dtb ]; then cp dtb "$AK/"; fi
          if [ -f dtbo.img ]; then cp dtbo.img "$AK/"; fi
          cd "$AK"
          rm -rf .git README.md *placeholder
          NAME="RealKing-munch-${{ github.event.inputs.kernelsu_variant }}-${{ github.event.inputs.susfs_enable }}-${{ github.run_number }}.zip"
          zip -r9 "/tmp/$NAME" *
          cp "/tmp/$NAME" "$GITHUB_WORKSPACE/$NAME"
          ls -l "$GITHUB_WORKSPACE/$NAME"

      - name: 保留编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed
          path: |
            kernel/build.log
            kernel/out/.config
          retention-days: 7

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: RealKing-munch-${{ github.event.inputs.kernelsu_variant }}-${{ github.event.inputs.susfs_enable }}
          path: ${{ github.workspace }}/RealKing-munch-*.zip
          retention-days: 30
