name: Build munch kernel RealKing MIUI

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: 'KernelSU 变体'
        required: true
        type: choice
        default: 'SukiSU-Ultra'
        options:
          - 'SukiSU-Ultra'
          - 'None'
      kernel_suffix:
        description: '内核版本后缀，留空用默认'
        required: false
        type: string
        default: ''

env:
  KSRC: ${{ github.workspace }}/kernel
  KB: m-staging

jobs:
  build:
    name: Build munch
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: 安装依赖与工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex git \
            libelf-dev libssl-dev lz4 python3 python3-pip xz-utils zip unzip wget curl \
            clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          TC="$GITHUB_WORKSPACE/tc"
          mkdir -p "$TC/bin"
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-strip llvm-objcopy llvm-objdump llvm-ranlib; do
            if command -v "$t-14" >/dev/null 2>&1; then
              ln -sf "$(command -v $t-14)" "$TC/bin/$t"
            fi
          done
          "$TC/bin/clang" --version
          "$TC/bin/ld.lld" --version
          ls "$TC/bin"

      - name: 克隆 RealKing 内核源码
        run: |
          git clone --depth=1 -b $KB https://github.com/Rohail33/Realking_kernel_sm8250 "$KSRC"
          cd "$KSRC"
          # 这个树把 CC 包了一层 python2 的 gcc-wrapper.py，Ubuntu 24.04 没有 python2，去掉包装
          sed -i '/gcc-wrapper.py/d' Makefile
          grep -n "^CC" Makefile
          git log -1 --oneline
          make kernelversion
          ls -l arch/arm64/configs/munch_defconfig

      - name: 集成 KernelSU
        if: ${{ github.event.inputs.kernelsu_variant != 'None' }}
        run: |
          cd "$KSRC"
          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          ls -d drivers/kernelsu
          grep -n kernelsu drivers/Makefile drivers/Kconfig | head

      - name: 生成配置
        run: |
          cd "$KSRC"
          export PATH="$GITHUB_WORKSPACE/tc/bin:$PATH"
          make ARCH=arm64 O=out LLVM=1 CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- munch_defconfig
          if [ "${{ github.event.inputs.kernelsu_variant }}" != "None" ]; then
            scripts/config --file out/.config -e KSU -e KSU_MANUAL_HOOK
          fi
          if [ -n "${{ github.event.inputs.kernel_suffix }}" ]; then
            scripts/config --file out/.config --set-str LOCALVERSION "${{ github.event.inputs.kernel_suffix }}"
          fi
          make ARCH=arm64 O=out LLVM=1 CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -E "^CONFIG_KSU|^CONFIG_LOCALVERSION|^CONFIG_MODVERSIONS|^CONFIG_BUILD_ARM64" out/.config

      - name: 编译内核
        run: |
          cd "$KSRC"
          export PATH="$GITHUB_WORKSPACE/tc/bin:$PATH"
          make ARCH=arm64 O=out LLVM=1 CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) 2>&1 | tee build.log
          ls -l out/arch/arm64/boot/

      - name: 打包 AnyKernel3
        run: |
          cd "$KSRC/out/arch/arm64/boot"
          AK="$KSRC/anykernel"
          KRNL="Image"
          for f in Image.gz-dtb Image.gz Image; do
            if [ -f "$f" ]; then KRNL="$f"; break; fi
          done
          echo "kernel=$KRNL"
          cp "$KRNL" "$AK/"
          if [ -f dtb ]; then cp dtb "$AK/"; fi
          if [ -f dtbo.img ]; then cp dtbo.img "$AK/"; fi
          cd "$AK"
          rm -rf .git README.md *placeholder
          ZIP="/tmp/RealKing-munch-${{ github.run_number }}.zip"
          zip -r9 "$ZIP" *
          cp "$ZIP" "$GITHUB_WORKSPACE/"
          ls -l "$ZIP"

      - name: 保留编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed
          path: |
            kernel/build.log
            kernel/out/.config
          retention-days: 7

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: RealKing-munch-kernel
          path: ${{ github.workspace }}/RealKing-munch-*.zip
          retention-days: 30
