name: Build akers tree with latest KSU

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'KSU 变体'
        required: true
        type: choice
        default: 'SukiSU-Ultra'
        options:
          - 'SukiSU-Ultra'
          - 'ReSukiSU'
      ksu_ref:
        description: 'KSU 分支或标签'
        required: true
        type: string
        default: 'v4.3.0'
      susfs:
        description: 'SUSFS'
        required: true
        type: choice
        default: 'enable'
        options:
          - 'enable'
          - 'disable'
      susfs_src:
        description: 'SUSFS 来源'
        required: true
        type: choice
        default: 'latest'
        options:
          - 'latest'
          - 'tree'

env:
  SRC: ${{ github.workspace }}/kernel

jobs:
  build:
    name: Build munch latest KSU
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio \
            libssl-dev ccache python-is-python3 unzip libelf-dev

      - name: 准备 Clang 13.0.1
        run: |
          mkdir -p $HOME/proton-clang/proton-clang-20210522
          cd $HOME/proton-clang/proton-clang-20210522
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/13.0.1-20230207-release/Clang-13.0.1-20230207.tar.gz
          tar -zxf Clang-13.0.1-20230207.tar.gz
          export PATH="$HOME/proton-clang/proton-clang-20210522/bin:$PATH"
          clang --version

      - name: 克隆内核源码
        run: |
          git clone --depth=1 -b android16-aptusitu-zyc \
            https://github.com/akers4238/kernel_xiaomi_sm8250_mod-20251002-zyc "$SRC"
          cd "$SRC"
          git log -1 --oneline
          make kernelversion

      - name: 集成最新 KSU 驱动
        run: |
          cd "$SRC"
          V="${{ github.event.inputs.ksu_variant }}"
          R="${{ github.event.inputs.ksu_ref }}"
          if [ "$V" = "ReSukiSU" ]; then
            URL="https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/$R/kernel/setup.sh"
          else
            URL="https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/$R/kernel/setup.sh"
          fi
          echo "驱动来源 $URL"
          curl -LSs "$URL" | bash -s "$R"
          echo "==== 驱动目录检查 ===="
          ls -ld drivers/kernelsu
          readlink -f drivers/kernelsu
          ls drivers/kernelsu | head -10
          if [ ! -s drivers/kernelsu/Kconfig ]; then
            echo "Kconfig 缺失，重建链接"
            rm -rf drivers/kernelsu
            ln -s ../KernelSU/kernel drivers/kernelsu
          fi
          wc -l drivers/kernelsu/Kconfig
          echo "==== drivers/Kconfig 里的 source ===="
          grep -n "kernelsu" drivers/Kconfig drivers/Makefile | head -5

      - name: 打 4.19 兼容补丁
        run: |
          cd "$SRC"
          grep -Rl "MODULE_IMPORT_NS" drivers/kernelsu 2>/dev/null | while read f; do
            sed -i 's|^MODULE_IMPORT_NS(.*|/* 4.19 无此宏 */|' "$f"
          done
          if [ ! -f include/linux/pgtable.h ]; then
            printf '#ifndef _LINUX_PGTABLE_SHIM_H\n#define _LINUX_PGTABLE_SHIM_H\n#include <asm/pgtable.h>\n#endif\n' > include/linux/pgtable.h
          fi
          H=include/linux/ksu_compat.h
          echo '#ifndef _LINUX_KSU_COMPAT_H' > $H
          echo '#define _LINUX_KSU_COMPAT_H' >> $H
          echo '#include <linux/uaccess.h>' >> $H
          grep -Rq "strncpy_from_user_nofault" include/linux/ 2>/dev/null || printf 'static inline long strncpy_from_user_nofault(char *d, const void __user *s, long c)\n{\n\tlong r;\n\tpagefault_disable();\n\tr = strncpy_from_user(d, s, c);\n\tpagefault_enable();\n\treturn r;\n}\n' >> $H
          grep -Rq "copy_to_kernel_nofault" include/linux/ 2>/dev/null || printf 'static inline long copy_to_kernel_nofault(void *d, const void __user *s, size_t n)\n{\n\tunsigned long r;\n\tpagefault_disable();\n\tr = copy_from_user(d, s, n);\n\tpagefault_enable();\n\treturn r ? -EFAULT : 0;\n}\n' >> $H
          grep -Rq "copy_from_kernel_nofault" include/linux/ 2>/dev/null || printf 'static inline long copy_from_kernel_nofault(void *d, const void *s, size_t n)\n{\n\tif (!access_ok(VERIFY_READ, s, n))\n\t\treturn -EFAULT;\n\tmemcpy(d, s, n);\n\treturn 0;\n}\n' >> $H
          echo '#endif' >> $H
          KC=drivers/kernelsu/compat/kernel_compat.h
          if [ -f "$KC" ]; then
            grep -q "ksu_compat.h" "$KC" || sed -i '1i #include <linux/ksu_compat.h>' "$KC"
          else
            grep -Rl "nofault" drivers/kernelsu --include=*.c 2>/dev/null | while read f; do grep -q "ksu_compat.h" "$f" || sed -i '1i #include <linux/ksu_compat.h>' "$f"; done
          fi
          echo "ksu_compat.h nofault 行数: $(grep -c nofault $H)"
          if ! grep -q "REMAP_FILE_DEDUP" include/linux/fs.h; then
            sed -i 's|^struct file_operations {|#ifndef REMAP_FILE_DEDUP\n#define REMAP_FILE_DEDUP 4\n#endif\n\nstruct file_operations {|' include/linux/fs.h
          fi
          if ! grep -q "iopoll)(struct kiocb" include/linux/fs.h; then
            sed -i 's|^struct file_operations {|struct file_operations {\n\tint (*iopoll)(struct kiocb *kiocb, bool spin);\n\tloff_t (*remap_file_range)(struct file *file_in, loff_t pos_in, struct file *file_out, loff_t pos_out, loff_t len, unsigned int remap_flags);|' include/linux/fs.h
          fi
            sed -i 's|^struct file_operations {|struct file_operations {\n\tint (*iopoll)(struct kiocb *kiocb, bool spin);\n\tloff_t (*remap_file_range)(struct file *file_in, loff_t pos_in, struct file *file_out, loff_t pos_out, loff_t len, unsigned int remap_flags);|' include/linux/fs.h
          fi
          FW=drivers/kernelsu/infra/file_wrapper.c
          if [ -f "$FW" ]; then
            sed -i 's|error = security_inode_init_security_anon(inode, &qname, context_inode);|error = 0; /* 4.19 无此接口 */|' "$FW"
          fi
          if [ -f drivers/kernelsu/infra/seccomp_cache.c ]; then
            printf '#include <linux/types.h>\nstruct seccomp_filter;\nvoid ksu_seccomp_clear_cache(struct seccomp_filter *filter, int nr) { (void)filter; (void)nr; }\nvoid ksu_seccomp_allow_cache(struct seccomp_filter *filter, int nr) { (void)filter; (void)nr; }\n' > drivers/kernelsu/infra/seccomp_cache.c
          fi
          grep -Rl "uapi/linux/mount.h" drivers/kernelsu 2>/dev/null | while read f; do
            sed -i 's|#include <uapi/linux/mount.h>|#include <linux/mount.h>|' "$f"
          done
          # ReSukiSU rc3 拒绝 3.x 时代的旧开关钩子，去掉 extern 与条件判断，改成无条件调用
          if [ "${{ github.event.inputs.ksu_variant }}" = "ReSukiSU" ]; then
            for f in fs/read_write.c fs/exec.c drivers/input/input.c; do
              if [ -f "$f" ]; then
                sed -i '/extern bool ksu_vfs_read_hook/d;/extern bool ksu_execveat_hook/d;/extern bool ksu_input_hook/d' "$f"
                sed -i 's/if (unlikely(ksu_vfs_read_hook))/if (1)/;s/if (unlikely(ksu_execveat_hook))/if (1)/;s/if (unlikely(ksu_input_hook))/if (1)/;s/if (!ksu_execveat_hook)/if (1)/' "$f"
              fi
            done
            grep -rn "ksu_vfs_read_hook\|ksu_execveat_hook\|ksu_input_hook" fs/read_write.c fs/exec.c drivers/input/input.c | head -5 || echo "旧钩子已清理"
          fi

      - name: 补 reboot 钩子
        run: |
          cd "$SRC"
          if ! grep -q "ksu_handle_sys_reboot" kernel/reboot.c; then
            N=$(awk '/SYSCALL_DEFINE4\(reboot,/{f=NR} f && /int ret = 0;/ && NR>f {print NR; exit}' kernel/reboot.c)
            echo "reboot 插入位置 $N"
            { head -n "$N" kernel/reboot.c; printf '#ifdef CONFIG_KSU_MANUAL_HOOK\n\textern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n'; tail -n +$((N+1)) kernel/reboot.c; } > /tmp/reboot.c
            mv /tmp/reboot.c kernel/reboot.c
            grep -n "ksu_handle_sys_reboot" kernel/reboot.c
          fi
          if ! grep -q "ksu_handle_setresuid" kernel/sys.c; then
            N=$(awk '/long __sys_setresuid/{f=NR} f && /make_kuid\(ns, ruid\)/ && NR>f {print NR; exit}' kernel/sys.c)
            echo "setresuid 插入位置 $N"
            { head -n $((N-1)) kernel/sys.c; printf '#ifdef CONFIG_KSU_MANUAL_HOOK\n\textern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n\tksu_handle_setresuid(ruid, euid, suid);\n#endif\n'; tail -n +$N kernel/sys.c; } > /tmp/sys.c
            mv /tmp/sys.c kernel/sys.c
            grep -n "ksu_handle_setresuid" kernel/sys.c
          fi

      - name: 更新 SUSFS 到最新
        if: ${{ github.event.inputs.susfs == 'enable' && github.event.inputs.susfs_src == 'latest' }}
        run: |
          cd "$SRC"
          git clone --depth=1 -b kernel-4.19 https://github.com/ShirkNeko/susfs4ksu /tmp/susfs
          cp /tmp/susfs/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          cp /tmp/susfs/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
          cp /tmp/susfs/kernel_patches/fs/susfs.c fs/susfs.c
          echo "CMD_SUSFS 条数：$(grep -c CMD_SUSFS include/linux/susfs_def.h)"
          grep -n "HIDE_SUS_MNTS_FOR_NON_SU_PROCS\|ADD_SUS_MAP\|ENABLE_AVC_LOG_SPOOFING" include/linux/susfs_def.h | head -5

      - name: 编译
        run: |
          cd "$SRC"
          export PATH="$HOME/proton-clang/proton-clang-20210522/bin:$PATH"
          export CCACHE_DIR="$HOME/.cache/ccache_mikernel"
          MAKE_ARGS="ARCH=arm64 SUBARCH=arm64 O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"
          make $MAKE_ARGS munch_defconfig
          scripts/config --file out/.config -e KPROBES -e KSU -e KSU_MANUAL_HOOK \
            -e KSU_MANUAL_HOOK_AUTO_SETUID_HOOK -e KSU_MANUAL_HOOK_AUTO_INITRC_HOOK
          if [ "${{ github.event.inputs.susfs }}" = "enable" ]; then
            scripts/config --file out/.config -e KSU_SUSFS -e KSU_SUSFS_SUS_MOUNT \
              -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_TRY_UMOUNT \
              -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG \
              -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
              -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
              -d KSU_SUSFS_SUS_PATH -d KSU_SUSFS_SUS_OVERLAYFS -d KSU_SUSFS_OPEN_REDIRECT -d KSU_SUSFS_SUS_SU
          fi
          make $MAKE_ARGS olddefconfig
          echo "==== KPROBES 状态 ===="
          grep -E "CONFIG_KPROBES|CONFIG_HAVE_KPROBES" out/.config || true
          echo "==== KSU 相关配置 ===="
          grep -i ksu out/.config | head -25
          echo "==== 驱动 Kconfig 头部 ===="
          head -25 drivers/kernelsu/Kconfig
          if ! grep -q "^CONFIG_KSU=y" out/.config; then
            echo "CONFIG_KSU 没有生效，停止"
            exit 1
          fi
          set -o pipefail
          make $MAKE_ARGS -j$(nproc) 2>&1 | tee build.log
          ls -l out/arch/arm64/boot/Image

      - name: 打包 AnyKernel3
        run: |
          cd "$SRC"
          find out/arch/arm64/boot/dts -name '*.dtb' -exec cat {} + > out/arch/arm64/boot/dtb
          git clone --depth=1 -b kona https://github.com/liyafe1997/AnyKernel3 anykernel
          mkdir -p anykernel/kernels
          cp out/arch/arm64/boot/Image anykernel/kernels/
          cp out/arch/arm64/boot/dtb anykernel/kernels/
          cd anykernel
          NAME="munch-${{ github.event.inputs.ksu_variant }}-${{ github.event.inputs.ksu_ref }}-susfs${{ github.event.inputs.susfs }}.zip"
          zip -r9 "../$NAME" *
          cd ..
          ls -l "$NAME"
          cp "$NAME" "$GITHUB_WORKSPACE/"

      - name: 保留失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed
          path: |
            kernel/build.log
            kernel/out/.config
          retention-days: 7

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: munch-${{ github.event.inputs.ksu_variant }}-${{ github.event.inputs.ksu_ref }}
          path: ${{ github.workspace }}/munch-*.zip
          retention-days: 30
